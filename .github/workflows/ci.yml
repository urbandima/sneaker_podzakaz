name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: '8.1'
  NODE_VERSION: '18'

jobs:
  # ============================================
  # LINT & STATIC ANALYSIS
  # ============================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_mysql, json, curl, fileinfo
          tools: composer:v2, phpcs, phpstan

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHP CodeSniffer
        run: vendor/bin/phpcs --standard=PSR12 --ignore=vendor/,runtime/,web/assets/ controllers/ models/ components/ services/ || true

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse -l 5 controllers/ models/ components/ services/ --no-progress || true

  # ============================================
  # UNIT & INTEGRATION TESTS
  # ============================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sneaker_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo, pdo_mysql, json, curl, fileinfo
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create test .env
        run: |
          cp .env.example .env
          echo "COOKIE_VALIDATION_KEY=$(openssl rand -hex 32)" >> .env
          echo "DB_DSN=mysql:host=127.0.0.1;dbname=sneaker_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env
          echo "YII_ENV=test" >> .env
          echo "YII_DEBUG=true" >> .env

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --coverage-text --colors=always
        env:
          DB_DSN: mysql:host=127.0.0.1;dbname=sneaker_test
          DB_USERNAME: root
          DB_PASSWORD: root

  # ============================================
  # BUILD ASSETS
  # ============================================
  build:
    name: Build Assets
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-assets
          path: |
            web/css/dist/
            web/js/dist/

  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Security check
        run: composer audit

  # ============================================
  # DEPLOY TO STAGING
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-assets

      - name: Deploy to staging
        run: |
          echo "Deploying to staging server..."
          # Add your staging deployment commands here

  # ============================================
  # DEPLOY TO PRODUCTION
  # Requires GitHub Secrets (Settings → Secrets → Actions):
  #   SSH_HOST        — IP или hostname сервера (например: sneaker-head.by)
  #   SSH_USER        — пользователь SSH (root / ubuntu / deploy)
  #   SSH_PRIVATE_KEY — содержимое ~/.ssh/id_rsa (-----BEGIN ... PRIVATE KEY-----)
  # Опционально:
  #   SSH_PATH        — путь к проекту (по умолчанию: /var/www/sneaker-head)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to production via SSH
        env:
          DEPLOY_PATH: ${{ secrets.SSH_PATH || '/var/www/sneaker-head' }}
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            set -e
            cd $DEPLOY_PATH
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php yii migrate --interactive=0
            php yii cache/flush-all
          "

      - name: Notify Sentry of deployment
        run: |
          curl -sL https://sentry.io/api/0/organizations/${{ secrets.SENTRY_ORG }}/releases/ \
            -H "Authorization: Bearer ${{ secrets.SENTRY_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"version": "${{ github.sha }}", "projects": ["sneaker-head"]}' || true
