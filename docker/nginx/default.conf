# Nginx Configuration for СНИКЕРХЭД (Docker)
# Production-ready with security headers, rate limiting, and optimizations

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    
    root /var/www/web;
    index index.php;
    
    charset utf-8;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # ====================
    # SECURITY HEADERS
    # ====================
    
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://api.poizon-parser.com https://*.sentry.io; frame-ancestors 'self'; form-action 'self'; base-uri 'self';" always;
    
    # Prevent MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Permissions Policy
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    
    # Hide server version
    server_tokens off;
    
    # ====================
    # GZIP COMPRESSION
    # ====================
    
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        image/svg+xml;
    gzip_disable "msie6";
    
    # ====================
    # STATIC FILES CACHING
    # ====================
    
    # Images
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
    
    # Fonts
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
        try_files $uri =404;
    }
    
    # CSS and JavaScript
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }
    
    # ====================
    # BLOCK ACCESS
    # ====================
    
    # Block access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to sensitive files
    location ~* (\.env|composer\.(json|lock)|package(-lock)?\.json|\.git|\.gitignore|README\.md|gulpfile\.js|Dockerfile|docker-compose\.yml)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Block access to sensitive directories
    location ~ ^/(vendor|runtime|tests|migrations|docker|bin|commands|config)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ====================
    # RATE LIMITING
    # ====================
    
    # API endpoints
    location ~ ^/(catalog/(search|filter|load-more|add-favorite|remove-favorite)|cart/(add|update|remove|count)) {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn_limit 10;
        try_files $uri /index.php?$args;
    }
    
    # Login/Auth endpoints
    location ~ ^/(login|site/login) {
        limit_req zone=login burst=3 nodelay;
        try_files $uri /index.php?$args;
    }
    
    # Admin area
    location ~ ^/admin {
        limit_req zone=general burst=50 nodelay;
        limit_conn conn_limit 20;
        try_files $uri /index.php?$args;
    }
    
    # ====================
    # YII2 ROUTING
    # ====================
    
    location / {
        limit_req zone=general burst=100 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }
    
    # PHP-FPM Configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        
        # Security
        fastcgi_hide_header X-Powered-By;
    }
    
    # ====================
    # SPECIAL ROUTES
    # ====================
    
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
    
    location = /sitemap.xml {
        access_log off;
        log_not_found off;
    }
    
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    # Health check endpoint
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
    
    # ====================
    # CLIENT SETTINGS
    # ====================
    
    client_max_body_size 20M;
    client_body_buffer_size 128k;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;
}
