version: '3.8'

services:
  # ============================================
  # PHP-FPM Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sneakerhead-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./config/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - sneakerhead-network
    depends_on:
      - db
      - redis
    environment:
      - YII_ENV=${YII_ENV:-dev}
      - YII_DEBUG=${YII_DEBUG:-true}
      - DB_DSN=mysql:host=db;port=3306;dbname=${DB_NAME:-sneaker_db};charset=utf8mb4
      - DB_USER=${DB_USER:-sneaker}
      - DB_USERNAME=${DB_USER:-sneaker}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME:-sneaker_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - COOKIE_VALIDATION_KEY=${COOKIE_VALIDATION_KEY}
      - COMPANY_NAME=${COMPANY_NAME:-СникерКультура}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@sneakerculture.by}
      - MAIL_USE_FILE_TRANSPORT=${MAIL_USE_FILE_TRANSPORT:-true}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-noreply@sneakerculture.by}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-СникерКультура}

  # ============================================
  # Nginx Web Server
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: sneakerhead-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
      - "${NGINX_SSL_PORT:-8443}:443"
    volumes:
      - .:/var/www
      - ./config/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - sneakerhead-network
    depends_on:
      - app

  # ============================================
  # MySQL Database
  # ============================================
  db:
    image: mysql:8.0
    container_name: sneakerhead-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-sneaker_db}
      MYSQL_USER: ${DB_USERNAME:-sneaker}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql
      - ./config/mysql/init:/docker-entrypoint-initdb.d
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - sneakerhead-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: sneakerhead-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - sneakerhead-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Node.js for Asset Building
  # ============================================
  node:
    image: node:18-alpine
    container_name: sneakerhead-node
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: sh -c "npm install && npm run watch"
    networks:
      - sneakerhead-network
    profiles:
      - dev

  # ============================================
  # Mailhog for Email Testing (dev only)
  # ============================================
  mailhog:
    image: mailhog/mailhog
    container_name: sneakerhead-mailhog
    ports:
      - "${MAILHOG_PORT:-8025}:8025"
      - "${MAILHOG_SMTP:-1025}:1025"
    networks:
      - sneakerhead-network
    profiles:
      - dev

networks:
  sneakerhead-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
