version: '3.8'

services:
  # Elasticsearch для полнотекстового поиска
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: sneakerhead_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - sneakerhead_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis для кеширования и сессий
  redis:
    image: redis:7-alpine
    container_name: sneakerhead_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sneakerhead_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  es_data:
    driver: local
  redis_data:
    driver: local

networks:
  sneakerhead_network:
    driver: bridge
